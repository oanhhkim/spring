spring.application.name=keycloak

# Server Configuration
server.port=8080

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/demo
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/demo/protocol/openid-connect/certs

# OAuth2 Client Configuration (for testing login flow)
spring.security.oauth2.client.registration.keycloak.client-id=spring-boot-app
spring.security.oauth2.client.registration.keycloak.client-secret=DxqJFVQEeiXZ1qPEtOkjvSKQazbhJOVy
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email,roles
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/demo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.keycloak=DEBUG

# Application Configuration
app.jwt.resource-id=spring-boot-app

# Test Configuration
spring.application.name=keycloak-test

# Mock Keycloak Configuration for Testing
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/test-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/test-realm/protocol/openid-connect/certs

# Disable real JWT validation in tests
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

# Test Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.keycloak=DEBUG

# Application Configuration
app.jwt.resource-id=spring-boot-app-test